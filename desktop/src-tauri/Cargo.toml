[package]
name = "agentree-desktop"
version = "0.1.0"
description = "agentree 桌面壳"
edition = "2021"
publish = false

[[bin]]
name = "agentree"
path = "src/main.rs"

[features]
# 便携版：把 node.exe、后端和前端嵌进 exe，不依赖项目目录和机器上的 Node。
# 由根目录的 npm run portable 开启，平时的开发和 desktop:build 不开。
portable = ["dep:brotli-decompressor", "dep:tar"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 便携版解压内嵌的运行环境用（纯 Rust；brotli-decompressor 本来就是 tauri 的依赖）
brotli-decompressor = { version = "6", optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
